name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name VirtualOnvifCamera `
            --hidden-import pywintypes `
            --hidden-import servicemanager `
            --hidden-import win32event `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --add-data "static;static" `
            --add-data "onvif_simulator/static/parkings;onvif_simulator/static/parkings" `
            virtual_onvif_camera.py

      - name: Copy service helpers
        shell: pwsh
        run: |
          Copy-Item windows\*.bat dist\
          python -c "from pathlib import Path; from virtual_onvif_camera import ensure_config_file; ensure_config_file(Path('dist/virtual_onvif_camera.ini'))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualOnvifCamera-windows-x64
          path: dist/*
