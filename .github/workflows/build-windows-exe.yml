name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name VirtualOnvifCamera `
            --add-data "static;static" `
            --add-data "onvif_simulator/static/parkings;onvif_simulator/static/parkings" `
            virtual_onvif_camera.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualOnvifCamera-windows-x64
          path: dist/VirtualOnvifCamera.exe
