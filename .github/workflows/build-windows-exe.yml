name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Download desktop RTSP runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"
          $ffmpeg = Get-ChildItem -Path "ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpeg.FullName "tools\ffmpeg.exe"

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/bluenviron/mediamtx/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "windows_amd64.*\.zip$" } | Select-Object -First 1
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "mediamtx.zip"
          Expand-Archive -Path "mediamtx.zip" -DestinationPath "mediamtx"
          $mediamtx = Get-ChildItem -Path "mediamtx" -Recurse -Filter "mediamtx.exe" | Select-Object -First 1
          Copy-Item $mediamtx.FullName "tools\mediamtx.exe"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name VirtualOnvifCamera `
            --hidden-import pywintypes `
            --hidden-import servicemanager `
            --hidden-import win32event `
            --hidden-import win32service `
            --hidden-import win32serviceutil `
            --add-data "static;static" `
            --add-data "onvif_simulator/static/parkings;onvif_simulator/static/parkings" `
            virtual_onvif_camera.py

      - name: Copy service helpers
        shell: pwsh
        run: |
          Copy-Item windows\*.bat dist\
          Copy-Item tools\*.exe dist\
          python -c "from pathlib import Path; from virtual_onvif_camera import ensure_config_file; ensure_config_file(Path('dist/virtual_onvif_camera.ini'))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualOnvifCamera-windows-x64
          path: dist/*
